<style>
:root {
  /* Matches the VG726 start page: paper, ink, Fraktur titles, mono labels, red accent */
  --paper: #e4dbc2;
  --sheet: #efe8d4;
  --ink: #24231d;
  --muted: #625c4a;
  --feldgrau: #8e2316;
  --rule: #a99d7c;
  --warn: #8e2316;
  --info-bg: #e9e0c8;
  --warn-bg: #f1dccf;
  --display: "UnifrakturMaguntia", "Old English Text MT", serif;
  --body: "Source Serif 4", Georgia, "Times New Roman", serif;
  --ui: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 17px/1.6 var(--body); background-image: radial-gradient(rgba(0,0,0,.04) 1px, transparent 1px); background-size: 4px 4px; }
a { color: var(--feldgrau); text-underline-offset: 2px; }
a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--feldgrau); outline-offset: 2px; }

header.top {
  display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
  padding: 14px 24px; border-bottom: 3px double var(--ink); background: var(--sheet);
  position: sticky; top: 0; z-index: 5;
}
.brand { display: flex; align-items: baseline; gap: 12px; text-decoration: none; color: var(--ink); }
.brand b { font: 400 34px/1 var(--display); }
.brand span { font: 500 13px/1.2 var(--ui); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.search { flex: 1 1 260px; max-width: 460px; margin-left: auto; position: relative; }
.search input {
  font-family: var(--body) !important;
  width: 100%; padding: 9px 12px 9px 34px; border: 1px solid var(--rule); border-radius: 4px;
  background: var(--paper); color: var(--ink); font: 16px var(--ui);
}
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.home { font: 500 12px var(--ui); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); text-decoration: none; }
.home:hover { color: var(--feldgrau); }
#menuBtn { display: none; font: 500 14px var(--ui); background: none; border: 1px solid var(--rule); color: var(--ink); padding: 7px 12px; border-radius: 4px; cursor: pointer; }

.wrap { display: grid; grid-template-columns: 250px minmax(0, 1fr); max-width: 1180px; margin: 0 auto; }
nav.side { padding: 24px 16px 40px 24px; border-right: 1px solid var(--rule); font-family: var(--ui); position: sticky; top: 72px; align-self: start; max-height: calc(100vh - 72px); overflow-y: auto; }
nav.side h4 { margin: 18px 0 4px; font: 600 12px var(--ui); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
nav.side h4:first-child { margin-top: 0; }
nav.side a { font-family: var(--body); display: block; padding: 4px 8px; margin-left: -8px; border-radius: 3px; text-decoration: none; color: var(--ink); font-size: 15px; line-height: 1.3; }
nav.side a:hover { background: var(--info-bg); }
nav.side a[aria-current="page"] { background: var(--ink); color: var(--sheet); }
nav.side .extra { margin-top: 24px; padding-top: 12px; border-top: 1px solid var(--rule); }

main { padding: 32px 40px 80px; min-width: 0; }
article { max-width: 1000px; }
article > :not(.tw):not(.pager) { max-width: 70ch; }
article > p > img { max-width: 220px; }
.crumb { font: 500 12px var(--ui); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }
h1 { font: 600 38px/1.15 var(--body); margin: 6px 0 2px; text-wrap: balance; }
.de { font: 400 24px/1.3 var(--display); color: var(--feldgrau); margin: 0 0 24px; }
article h2 { font: 600 25px/1.25 var(--body); margin: 36px 0 8px; text-wrap: balance; }
article h3 { font: 600 19px/1.3 var(--body); margin: 28px 0 6px; padding-bottom: 3px; border-bottom: 1px solid var(--rule); text-wrap: balance; }
article p { margin: 0 0 12px; }
article ul, article ol { padding-left: 1.3em; margin: 0 0 14px; }
article li > p { margin: 0 0 6px; }
article img { max-width: 100%; height: auto; display: block; }
.note { display: block; margin: 0 0 22px; padding: 12px 16px; border-left: 4px solid var(--feldgrau); background: var(--info-bg); font-size: 16px; border-radius: 0 4px 4px 0; }
.note-warn { border-color: var(--warn); background: var(--warn-bg); }

.tw { overflow-x: auto; margin: 10px 0 24px; border: 1px solid var(--rule); border-radius: 4px; background: var(--sheet); }
.tw table { border-collapse: collapse; width: 100%; font: 15px/1.4 var(--body); font-variant-numeric: tabular-nums; }
.tw th { font-weight: 400; text-align: left; vertical-align: top; padding: 8px 10px; border-top: 1px solid var(--rule); }
.tw th p { margin: 0 0 3px; }
.tw tr[data-k="h"] th { font-weight: 600; background: var(--info-bg); border-top: 0; }
.tw tr[data-k="g"] th { font-family: var(--ui); font-weight: 500; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--feldgrau); background: var(--paper); }
.tw th img { width: 110px; max-width: none; border-radius: 3px; }
.tw ol { margin: 0; padding-left: 1.3em; }
article[data-id="zeichen"] .tw th img { width: 120px; background: #fff; padding: 4px; }
article[data-id="morse"] .tw th { font-family: var(--ui); font-size: 14px; }
article[data-id="morse"] .tw th:nth-child(3n) { font-weight: 600; letter-spacing: .12em; white-space: nowrap; }

.pager { display: flex; justify-content: space-between; gap: 16px; margin-top: 48px; padding-top: 16px; border-top: 3px double var(--ink); }
.pager a { text-decoration: none; display: grid; max-width: 48%; }
.pager a small { color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
.pager a.next { text-align: right; margin-left: auto; }

.home-intro { max-width: 64ch; }
.home-intro p { margin: 0 0 12px; }
.groups { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; margin-top: 28px; }
.grp { background: var(--sheet); border: 1px solid var(--rule); border-top: 4px solid var(--ink); border-radius: 4px; padding: 14px 16px 10px; }
.grp h2 { font: 600 13px var(--ui); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.grp a { display: block; text-decoration: none; padding: 7px 0; border-top: 1px solid var(--rule); color: var(--ink); }
.grp a:first-of-type { border-top: 0; }
.grp a b { display: block; font: 400 24px/1.15 var(--display); color: var(--ink); }
.grp a:hover b { color: var(--feldgrau); }
.grp a span { display: block; font: 15px/1.4 var(--body); color: var(--muted); }

.results { list-style: none; padding: 0; margin: 16px 0 0; max-width: 72ch; }
.results li { padding: 12px 0; border-bottom: 1px solid var(--rule); }
.results a { font: 600 19px var(--body); text-decoration: none; }
.results .g { font: 13px var(--ui); color: var(--muted); }
.results p { margin: 4px 0 0; font-size: 15px; color: var(--muted); }
.results mark, article mark.hit { background: #e8d27a; color: #1c201b; padding: 0 1px; }

.changes { font-size: 16px; }
.changes li { margin-bottom: 6px; }

@media (max-width: 820px) {
  .wrap { grid-template-columns: 1fr; }
  #menuBtn { display: inline-block; }
  nav.side { display: none; position: static; max-height: none; border-right: 0; border-bottom: 1px solid var(--rule); padding: 16px; }
  nav.side.open { display: block; }
  main { padding: 24px 16px 60px; }
  h1 { font-size: 30px; }
  .brand b { font-size: 28px; }
  header.top { padding: 10px 16px; gap: 10px; }
  .search { max-width: none; flex-basis: 100%; order: 3; }
}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }

<script type="application/json" id="data">[{"id": "organisatie", "group": "Organisatie", "title": "Unit formations", "de": "Gliederung des Heeres", "summary": "From Heeresgruppe down to Gruppe and Trupp: what each level is and how big it was.", "html": "<h3>Heeresgruppe (pl: Heeresgruppen) [Army Group]:<\/h3>\n<p>An organizational formation made up of a number of Armeen. The largest single German organizational formation during WWII. Usually consisted of hundreds of various units and upwards of a few hundred thousand men, all of which operated in a far-ranging geographic region of the front. An example would be Heeresgruppe Afrika which controlled all units fighting in North Africa at the time of its formation.<\/p>\n<h3>Armeegruppe (pl: Armeegruppen) [Army Group]:<\/h3>\n<p>By 1943 these were usually two or three adjacent Armeen, possibly but not always one German and one Axis-allied, with one of the Armee HQs (usually the German) temporarily placed in command over the others. An Armeegruppe was always subordinate to the local Heeresgruppe. Before late 1943, the term Armeegruppe had a less defined meaning and could mean an Armee-sized grouping(Panzergruppe 2 was reinforced in August 1941 and was called Armeegruppe Guderian) or even a Korps-sized unit (such as Armeegruppe Felber).<\/p>\n<h3>Armee (pl: Armeen) [Army]:<\/h3>\n<p>An Armee consisted of one or more Korps, plus any attached or independent units or formations, units in reserve, and its own organic units. Armee served at the strategic level, not at the tactical. In theory, an Armee would have had between 60,000 and 100,000 men within its ranks.<\/p>\n<h3>Korps (pl: Korps) [Corps]:<\/h3>\n<p>A Korps contained one or more Divisionen, plus any attached or independent units or formations, units in reserve, and its own organic units. Korps served at the strategic/operational level, directing the actions of mainly Divisional sized units, as well as the independent Abteilungen and Bataillone that were attached temporarily to the Korps or that were organic to it. In theory, a Korps would have had between 40,000 and 60,000 men within its ranks.<\/p>\n<h3>Division (pl: Divisionen) [Division]:<\/h3>\n<p>Divisionen varied depending on the type of Division, with most containing between 1 and 4 Regimenter, plus any attached or independent units or formations, and its own organic units. Divisionen served at the operational level, both in combat and as the operational HQ for the Regimenter and attached units and formations of the Division. In theory, a Division would have had between 10,000 and 20,000 men within its ranks.<\/p>\n<h3>Brigade (pl: Brigaden) [Brigade]:<\/h3>\n<p>Brigaden sized units served either as independent units, as an organic part of a specific Division, or sometimes as an organic part of a Korps in place of a Division. Brigaden served mostly at the operational/tactical level. In theory, a Brigade would have had between 5000 and 7000 men within its ranks.<\/p>\n<h3>Regiment (pl: Regimenter) [Regiment]:<\/h3>\n<p>Regimenter consisted of a number of Bataillone (in the artillery and other arms: Abteilungen), along with any attached units or formations, and its own organic units. Regimenter served mainly at the tactical level. In theory, a Regiment would have had between 2000 and 6000 men within its ranks.<\/p>\n<h3>Abteilung/Bataillon (pl: Abteilungen/Bataillone) [Battalion]:<\/h3>\n<p>Abteilungen and Bataillone consisted of a number of Kompanien, sometimes also with other attached units or formations. These units served at the tactical level directly engaging in combat. The Abteilung was the smallest self-contained and self-sufficient combat formation. It was armed and manned to be fully able to maintain itself in combat without the support of other units. Any unit below the level of Abteilung usually did not have enough offensive or defensive firepower and support elements (Pionier, Panzerjäger, Artillery, MGs, etc), to maintain itself in a combat situation. In theory, an Abteilung organization would have between 500 and 1000 men within its ranks.<\/p>\n\n<h3>Kompanie (pl: Kompanien) [Company]:<\/h3>\n<p>A Kompanie consisted of a number of Züge. Kompanien served at the tactical level. In theory, a Kompanie would have had between 100 and 200 men within its ranks.<\/p>\n<h3>Zug (pl: Züge) [Platoon]:<\/h3>\n<p>A Zug consisted of a number of Gruppen. The Zug served at the tactical level. In theory, a Zug would have had between 30 and 40 men within its ranks.<\/p>\n<h3>Gruppe (pl: Gruppen) [Group]:<\/h3>\n<p>The basic infantry sub-unit (squad) of roughly 10 men under a Gruppenführer, usually a component of a Zug.<\/p>\n<h3>Halbzug (pl: Halbzüge) [Half-platoon]:<\/h3>\n<p>The result when a normal-sized Zug was split into two separate parts.<\/p>\n<h3>Trupp (pl: Trupps) [Team]:<\/h3>\n<p>A small team of a few men, smaller than a Gruppe, formed for a specific task: for example the MG-Trupp of a Gruppe, a Spähtrupp or a Meldetrupp. (Note: <em>Truppen<\/em> means \"troops\", not the plural of Trupp.)<\/p>\n<h3>Kampfgruppe (pl: Kampfgruppen) [Battlegroup]:<\/h3>\n<p>The Kampfgruppe was an often-used German combat formation that doesn’t really have an equal in Allied organization, being closest in concept to that of an American task force. A Kampfgruppe could range in size from a Korps to an Abteilung or Kompanie in size. Most Kampfgruppen were usually around an Abteilung in size. The Kampfgruppe was essentially an ad-hoc organization of different arms (Some tanks, a few artillery pieces, infantry, some assault boats, a few anti-tank guns, etc), more-or-less organized temporarily for a specific operational task. These tasks could be short term or long term in nature, and they were often organized quickly in accordance with the tactical and strategic situation at hand. Kampfgruppen were usually named after the person chosen to command the formation. Kampfgruppe Pfieffer is an example of a German Kampfgruppe. It was organized very quickly from elements of the 21.Panzer-Division while it was stationed in North Africa. It was named after the commander chosen to lead the unit, and it was composed of detached Abteilungen of infantry, armor, and artillery. It was used in operations over the span of a few days. The concept of the Kampfgruppe was a key and central element in WWII German tactical doctrine. Many hundreds of Kampfgruppen are known to have existed during WWII, while many thousands more were used but will probably never be known because of the nature in which they were often formed and saw combat.<\/p>\n<p>Staffel (pl: Staffeln)<\/p>\n<p>An elastic designation for several components under a headquarters section, these components being from section to platoon size. Often this was merely an administrative grouping, and the components were distributed to other sub-units in combat. It could either have its own small headquarters section, or one of the components’ leaders could carry out a dual function.<\/p>\n<h3>Kolonne (pl: Kolonnen) [Column]:<\/h3>\n<p>An independent transportation unit, varying from company to platoon size, transporting equipment or supplies such as a bridge column (which in fact did not actually build the bridge it was transporting), or even as a light ‘infantry’ column(which consisted of a set number of horse-drawn vehicles capable of transporting a fixed tonnage).<\/p>", "text": "Heeresgruppe (pl: Heeresgruppen) [Army Group]: An organizational formation made up of a number of Armeen. The largest single German organizational formation during WWII. Usually consisted of hundreds of various units and upwards of a few hundred thousand men, all of which operated in a far-ranging geographic region of the front. An example would be Heeresgruppe Afrika which controlled all units fighting in North Africa at the time of its formation. Armeegruppe (pl: Armeegruppen) [Army Group]: By 1943 these were usually two or three adjacent Armeen, possibly but not always one German and one Axis-alli German combat formation that doesn’t really have an equal in Allied organization, being closest in concept to that of an American task force. A Kampfgruppe could range in size from a Korps to an Abteilung or Kompanie in size. Most Kampfgruppen were usually around an Abteilung in size. The Kampfgruppe was essentially an ad-hoc organization of different arms (Some tanks, a few artillery pieces, infantry, some assault boats, a few anti-tank guns, etc), more-or-less organized temporarily for a specific operational task. These tasks could be short term or long term in nature, and they were often organized quickly in accordance with the tactical and strategic situation at hand. Kampfgruppen were usually named after the person chosen to command the formation. Kampfgruppe Pfieffer is an example of a German Kampfgruppe. It was organized very quickly from elements of the 21.Panzer-Division while it was stationed in North Africa. It was named after the commander chosen to lead the unit, and it was composed of detached Abteilungen of infantry, armor, and artillery. It was used in operations over the span of a few days. The concept of the Kampfgruppe was a key and central element in WWII German tactical doctrine. Many hundreds of Kampfgruppen are known to have existed during WWII, while many thousands more were used but will probably never be known because of the nature in which they were often formed and saw combat. Staffel (pl: Staffeln) An elastic designation for several components under a headquarters section, these components being from section to platoon size. Often this was merely an administrative grouping, and the components were distributed to other sub-units in combat. It could either have its own small headquarters section, or one of the components’ leaders could carry out a dual function. Kolonne (pl: Kolonnen) [Column]: An independent transportation unit, varying from company to platoon size, transporting equipment or supplies such as a bridge column (which in fact did not actually build the bridge it was transporting), or even as a light ‘infantry’ column(which consisted of a set number of horse-drawn vehicles capable of transporting a fixed tonnage)."}, {"id": "gruppe-zug", "group": "Organisatie", "title": "Squad and platoon", "de": "Gruppe und Zug", "summary": "Who does what in the Gruppe and the Zug: Gruppenführer, deputy, MG team, riflemen, reporting line and formations.", "html": "<p>The Gruppe (squad) is the smallest unit you will work in, and the Zug (platoon) is the unit it belongs to. This chapter describes who does what, following the <em>H.Dv. 130/2a „Ausbildungsvorschrift für die Infanterie, Heft 2a: Die Schützenkompanie“<\/em> of 1942.<\/p>\n<h3>1. The Gruppe<\/h3>\n<p>A Gruppe has about ten men: the Gruppenführer, his deputy, the M.G.-Trupp of three men and the riflemen. The whole Gruppe is built around the light machine gun (l.M.G. 34 or 42): the riflemen support the MG, not the other way round.<\/p>\n<div class=\"tw\"><table>\n<tr data-k=\"h\" class=\"header\"><th>Position<\/th><th>Weapon and kit<\/th><th>Tasks<\/th><\/tr>\n<tr><th><p>Gruppenführer<\/p><p>(squad leader, usually an Unteroffizier)<\/p><\/th><th>Submachine gun with six magazines, magazine loader, binoculars, wire cutters, whistle.<\/th><th><ul><li><p>Carries out the squad’s combat task; leader and lead fighter of the squad.<\/p><\/li><li><p>Directs the fire of the light MG and, when the fight allows, of the riflemen.<\/p><\/li><li><p>Makes sure weapons, ammunition and kit of the squad are complete and serviceable.<\/p><\/li><\/ul><\/th><\/tr>\n<tr class=\"odd\"><th><p>Stellvertretender Gruppenführer<\/p><p>(deputy squad leader)<\/p><\/th><th>Rifle (from 1944 often an MP 40), plus the flag for marking the foremost line.<\/th><th><ul><li><p>Keeps the squad together: no rifleman is left behind.<\/p><\/li><li><p>Checks that all orders are carried out.<\/p><\/li><li><p>Keeps contact with the Zugführer and the neighbouring squads.<\/p><\/li><li><p>Marks the foremost line.<\/p><\/li><li><p>Takes over the squad when the Gruppenführer is out of action.<\/p><\/li><\/ul><\/th><\/tr>\n<tr><th><p>M.G.-Schütze 1<\/p><p>(Richtschütze, machine gunner)<\/p><\/th><th>Light MG with drum magazine, pistol, MG tool pouch, torch.<\/th><th><ul><li><p>Operates the light MG in combat.<\/p><\/li><li><p>Watches over the MG while it fires.<\/p><\/li><li><p>Looks after the MG.<\/p><\/li><\/ul><\/th><\/tr>\n<tr class=\"odd\"><th><p>M.G.-Schütze 2<\/p><p>(assistant gunner)<\/p><\/th><th>Spare barrel carrier, four drum magazines (one with armour-piercing rounds), one ammunition box, carrying strap, pistol, spade.<\/th><th><ul><li><p>Handles the drum magazines and refills them from the belts.<\/p><\/li><li><p>Helps with going into position, jams, barrel changes and setting up the bipod.<\/p><\/li><li><p>Lies to the left or left rear of the MG, in full cover if possible.<\/p><\/li><\/ul><\/th><\/tr>\n<tr><th><p>M.G.-Schütze 3<\/p><p>(Munitionsschütze, ammunition bearer)<\/p><\/th><th>Spare barrel carrier, two ammunition boxes, carrying strap, rifle, spade.<\/th><th><ul><li><p>Handles and watches over the ammunition.<\/p><\/li><li><p>Lies to the rear in full cover during the fight.<\/p><\/li><li><p>Fights as a rifleman when the situation requires.<\/p><\/li><\/ul><\/th><\/tr>\n<tr class=\"odd\"><th><p>Schützen 4–9<\/p><p>(Gewehrschützen, riflemen)<\/p><\/th><th>Rifle, two ammunition pouches, spade; hand grenades. On orders also MG belts, smoke grenades, bundled charges or the MG tripod.<\/th><th><ul><li><p>Fight the firefight with the rifle.<\/p><\/li><li><p>Are the close-combat fighters of the squad.<\/p><\/li><\/ul><\/th><\/tr>\n<\/table><\/div>\n<aside class=\"note note-info\"><p>From 1944 the Gruppe was often smaller: Gruppenführer, deputy, M.G.-Schütze 1 and 2 and five riflemen, without a separate Schütze 3. Ask your Gruppenführer how our group does it.<\/p><\/aside>\n<h3>2. Who reports to whom<\/h3>\n<p>Reports always go through the shortest line, one step up at a time:<\/p>\n<p><strong>Schütze → Gruppenführer → Zugführer → Kompanieführer<\/strong><\/p>\n<ul>\n<li><p>As a Schütze you report to your own Gruppenführer, not to the Zugführer.<\/p><\/li>\n<li><p>The deputy keeps contact with the Zugführer and the squads next to you, so he must always know the mission.<\/p><\/li>\n<li><p>A good report answers the four W’s: <em>Wann, Wer, Wie, Wo<\/em> (when, who or what, how, where). See the chapter Scout patrol.<\/p><\/li>\n<\/ul>\n<h3>3. The Gruppe on the move and in the fight<\/h3>\n<ul>\n<li><p><strong>Schützenreihe<\/strong> (single file): the men follow each other at fixed intervals, usually 5 paces. The Gruppenführer is in front, the M.G.-Schütze 1 directly behind him, and the deputy at the end so that nobody falls behind.<\/p><\/li>\n<li><p><strong>Schützenkette<\/strong> (skirmish line): the MG picks a position and forms the centre; the riflemen fan out to the left and right of it.<\/p><\/li>\n<li><p><strong>„Stellung!“<\/strong>: take up firing positions at once. The Gruppenführer leads by voice, whistle and the Führungszeichen (see Hand signals).<\/p><\/li>\n<\/ul>\n<h3>4. The Zug<\/h3>\n<p>A Schützenzug has about 30–40 men: three Gruppen plus the Zugtrupp (platoon headquarters).<\/p>\n<ul>\n<li><p><strong>Zugführer<\/strong>: leads the three Gruppen. In the 1st Zug often a Leutnant, in the 2nd and 3rd usually a Feldwebel.<\/p><\/li>\n<li><p><strong>Zugtrupp<\/strong>: the Zugführer with his Melder (messengers), a Krankenträger (stretcher bearer) and the drivers and horse leaders for the platoon’s cart; often with a reserve MG.<\/p><\/li>\n<li><p><strong>Melder<\/strong>: carry reports and orders between the Zug and the Kompanie, and between the Zugführer and his Gruppen.<\/p><\/li>\n<li><p>The Zugführer reports to the <strong>Kompanieführer<\/strong>. In the Kompanie the <strong>Spieß<\/strong> (Hauptfeldwebel) runs the daily duty and administration.<\/p><\/li>\n<\/ul>\n<p>For the larger units above the Zug (Kompanie, Bataillon, Regiment, Division and up), see the chapter Unit formations.<\/p>", "text": "The Gruppe (squad) is the smallest unit you will work in, and the Zug (platoon) is the unit it belongs to. This chapter describes who does what, following the H.Dv. 130/2a „Ausbildungsvorschrift für die Infanterie, Heft 2a: Die Schützenkompanie“ of 1942. 1. The Gruppe A Gruppe has about ten men: the Gruppenführer, his deputy, the M.G.-Trupp of three men and the riflemen. The whole Gruppe is built around the light machine gun (l.M.G. 34 or 42): the riflemen support the MG, not the other way round. Position Weapon and kit Tasks Gruppenführer (squad leader, usually an Unteroffizier) Submachine gun with six magazines, magazine loader, binoculars, wire cutters, whistle. Carries out the squad’s combat task; leader and lead fighter of the squad. Directs the fire of the light MG and, when the fight allows, of the riflemen. Makes sure weapons, ammunition and kit of the squad are complete and serviceable. Stellvertretender Gruppenführer (deputy squad leader) Rifle (from 1944 often an MP 40), plus the flag for marking the foremost line. Keeps the squad together: no rifleman is left behind. Checks that all orders are carried out. Keeps contact with the Zugführer and the neighbouring squads. Marks the foremost line. Takes over the squad when the Gruppenführer is out of action. M.G.-Schütze 1 (Richtschütze, machine gunner) Light MG with drum magazine, pistol, MG tool pouch, torch. Operates the light MG in combat. Watches over the MG while it fires. Looks after the MG. M.G.-Schütze 2 (assistant gunner) Spare barrel carrier, four drum magazines (one with armour-piercing rounds), one ammunition box, carrying strap, pistol, spade. Handles the drum magazines and refills them from the belts. Helps with going into position, jams, barrel changes and setting up the bipod. Lies to the left or left rear of the MG, in full cover if possible. M.G.-Schütze 3 (Munitionsschütze, ammunition bearer) Spare barrel carrier, two ammunition boxes, carrying strap, rifle, spade. Handles and watches over the ammunition. Lies to the rear in full cover during the fight. Fights as a rifleman when the situation requires. Schützen 4–9 (Gewehrschützen, riflemen) Rifle, two ammunition pouches, spade; hand grenades. On orders also MG belts, smoke grenades, bundled charges or the MG tripod. Fight the firefight with the rifle. Are the close-combat fighters of the squad. From 1944 the Gruppe was often smaller: Gruppenführer, deputy, M.G.-Schütze 1 and 2 and five riflemen, without a separate Schütze 3. Ask your Gruppenführer how our group does it. 2. Who reports to whom Reports always go through the shortest line, one step up at a time: Schütze → Gruppenführer → Zugführer → Kompanieführer As a Schütze you report to your own Gruppenführer, not to the Zugführer. The deputy keeps contact with the Zugführer and the squads next to you, so he must always know the mission. A good report answers the four W’s: Wann, Wer, Wie, Wo (when, who or what, how, where). See the chapter Scout patrol. 3. The Gruppe on the move and in the fight Schützenreihe (single file): the men follow each other at fixed intervals, usually 5 paces. The Gruppenführer is in front, the M.G.-Schütze 1 directly behind him, and the deputy at the end so that nobody falls behind. Schützenkette (skirmish line): the MG picks a position and forms the centre; the riflemen fan out to the left and right of it. „Stellung!“ : take up firing positions at once. The Gruppenführer leads by voice, whistle and the Führungszeichen (see Hand signals). 4. The Zug A Schützenzug has about 30–40 men: three Gruppen plus the Zugtrupp (platoon headquarters). Zugführer : leads the three Gruppen. In the 1st Zug often a Leutnant, in the 2nd and 3rd usually a Feldwebel. Zugtrupp : the Zugführer with his Melder (messengers), a Krankenträger (stretcher bearer) and the drivers and horse leaders for the platoon’s cart; often with a reserve MG. Melder : carry reports and orders between the Zug and the Kompanie, and between the Zugführer and his Gruppen. The Zugführer reports to the Kompanieführer . In the Kompanie the Spieß (Hauptfeldwebel) runs the daily duty and administration. For the larger units above the Zug (Kompanie, Bataillon, Regiment, Division and up), see the chapter Unit formations."}, {"id": "volksgrenadier", "group": "Organisatie", "title": "Volksgrenadier", "de": "Volksgrenadier-Division", "summary": "Why the Volksgrenadier divisions were created in 1944 and how they were organised.", "html": "<p>The strategic emergency and concomitant manpower shortage resulting from the losses in mid-1944 required the creation of <a href=\"https://en.wikipedia.org/wiki/Infantry\">infantry<\/a> divisions that economized on personnel and emphasized defensive strength over offensive strength. The Volksgrenadier divisions met this need by using only six line infantry <a href=\"https://en.wikipedia.org/wiki/Battalion\">battalions<\/a> instead of the normal nine for infantry divisions – already a common reality for many existing divisions. The units also had a higher proportion of <a href=\"https://en.wikipedia.org/wiki/Submachine_gun\">submachine guns<\/a> and light <a href=\"https://en.wikipedia.org/wiki/Automatic_firearm\">automatic weapons<\/a> and thus relied more on short-range firepower than in standard German Army infantry units. Automatic weapons like the new <a href=\"https://en.wikipedia.org/wiki/StG_44\">Sturmgewehr 44<\/a> and anti-tank weaponry like the single shot <a href=\"https://en.wikipedia.org/wiki/Panzerfaust\">Panzerfaust<\/a> were also used by Volksgrenadier units. One battalion of one grenadier regiment and the two companies of the engineer battalion were assigned bicycles for transportation instead of motor vehicles.<\/p>\n<p>They were organized around small cadres of hardened veteran soldiers, noncommissioned officers and officers, and then bulked out with anything the Replacement Army could supply: \"jobless\" personnel of the shrinking <a href=\"https://en.wikipedia.org/wiki/Kriegsmarine\">Kriegsmarine<\/a> and <a href=\"https://en.wikipedia.org/wiki/Luftwaffe\">Luftwaffe<\/a>, recovered wounded soldiers from broken formations returning to duty from hospitals, older men who would have been considered too old or too unfit for the peacetime army, and young men and teenagers from the latest conscription classes were all recruited into the ranks.<\/p>\n<h3>Organisation<\/h3>\n<ul>\n<li><p>Division headquarters<\/p><\/li>\n<li><p>Fusilier company or battalion (bicycle-mounted)<\/p>\n<\/blockquote>\n<ul>\n<li><p>Company headquarters<\/p><\/li>\n<li><p><a href=\"https://en.wikipedia.org/wiki/Submachine_gun\">Submachine gun<\/a> platoon<\/p><\/li>\n<li><p>Submachine gun platoon<\/p><\/li>\n<li><p>Rifle platoon<\/p><\/li>\n<li><p>Heavy weapons platoon<\/p><\/li>\n<li><p><a href=\"https://en.wikipedia.org/wiki/Infantry_support_gun\">Infantry howitzer<\/a> section<\/p><\/li>\n<\/ul><\/li>\n<li><p>Signal battalion<\/p>\n<\/blockquote>\n<ul>\n<li><p>Battalion headquarters<\/p><\/li>\n<li><p>Telephone company<\/p><\/li>\n<li><p>Radio company<\/p><\/li>\n<li><p>Supply platoon<\/p><\/li>\n<\/ul><\/li>\n<li><p>Grenadier regiment<\/p>\n<\/blockquote>\n<ul>\n<li><p>Regimental headquarters<\/p><\/li>\n<li><p>Regimental headquarters company<\/p><\/li>\n<li><p>Infantry battalion<\/p><\/li>\n<li><p>Infantry battalion<\/p><\/li>\n<li><p>Infantry howitzer company<\/p><\/li>\n<li><p>Antitank rocket launcher company<\/p><\/li>\n<\/ul><\/li>\n<li><p>Grenadier regiment<\/p><\/li>\n<li><p>Grenadier regiment<\/p><\/li>\n<li><p>Artillery regiment<\/p>\n<\/blockquote>\n<ul>\n<li><p>Regimental headquarters<\/p><\/li>\n<li><p>Regimental headquarters battery<\/p><\/li>\n<li><p>75 mm gun battalion<\/p><\/li>\n<li><p>105 mm gun/howitzer battalion<\/p><\/li>\n<li><p>105 mm gun/howitzer battalion<\/p><\/li>\n<li><p>150 mm howitzer battalion<\/p><\/li>\n<\/ul><\/li>\n<li><p>Antitank battalion<\/p>\n<\/blockquote>\n<ul>\n<li><p>Battalion headquarters<\/p><\/li>\n<li><p>Battalion headquarters company<\/p><\/li>\n<li><p>Antitank company (motorized)<\/p><\/li>\n<li><p>Antitank company (self-propelled)<\/p><\/li>\n<li><p>Antiaircraft company (self-propelled)<\/p><\/li>\n<\/ul><\/li>\n<li><p>Engineer battalion<\/p>\n<\/blockquote>\n<ul>\n<li><p>Battalion headquarters company<\/p><\/li>\n<li><p>Engineer company (bicycle-mounted)<\/p><\/li>\n<li><p>Engineer company (bicycle-mounted)<\/p><\/li>\n<\/ul><\/li>\n<li><p>Supply regiment<\/p>\n<\/blockquote>\n<ul>\n<li><p>Supply troops<\/p><\/li>\n<li><p>Ordnance company<\/p><\/li>\n<li><p>Maintenance platoon<\/p><\/li>\n<li><p>Administrative troops<\/p><\/li>\n<li><p>Medical troops<\/p><\/li>\n<li><p>Veterinary company<\/p><\/li>\n<li><p>Field post office<\/p><\/li>\n<\/ul><\/li>\n<\/ul>\n\n\n\n\n\n\n", "text": "The strategic emergency and concomitant manpower shortage resulting from the losses in mid-1944 required the creation of infantry divisions that economized on personnel and emphasized defensive strength over offensive strength. The Volksgrenadier divisions met this need by using only six line infantry battalions instead of the normal nine for infantry divisions – already a common reality for many existing divisions. The units also had a higher proportion of submachine guns and light automatic weapons and thus relied more on short-range firepower than in standard German Army infantry units. Automatic weapons like the new Sturmgewehr 44 and anti-tank weaponry like the single shot Panzerfaust were also used by Volksgrenadier units. One battalion of one grenadier regiment and the two companies of the engineer battalion were assigned bicycles for transportation instead of motor vehicles. They were organized around small cadres of hardened veteran soldiers, noncommissioned officers and officers, and then bulked out with anything the Replacement Army could supply: \"jobless\" personnel of the shrinking Kriegsmarine and Luftwaffe , recovered wounded soldiers from broken formations returning to duty from hospitals, older men who would have been considered too old or too unfit for the peacetime army, and young men and teenagers from the latest conscription classes were all recruited into the ranks. Organisation Division headquarters Fusilier company or battalion (bicycle-mounted) Company headquarters Submachine gun platoon Submachine gun platoon Rifle platoon Heavy weapons platoon Infantry howitzer section Signal battalion Battalion headquarters Telephone company Radio company Supply platoon Grenadier regiment Regimental headquarters Regimental headquarters company Infantry battalion Infantry battalion Infantry howitzer company Antitank rocket launcher company Grenadier regiment Grenadier regiment Artillery regiment Regimental headquarters Regimental headquarters battery 75 mm gun battalion 105 mm gun/howitzer battalion 105 mm gun/howitzer battalion 150 mm howitzer battalion Antitank battalion Battalion headquarters Battalion headquarters company Antitank company (motorized) Antitank company (self-propelled) Antiaircraft company (self-propelled) Engineer battalion Battalion headquarters company Engineer company (bicycle-mounted) Engineer company (bicycle-mounted) Supply regiment Supply troops Ordnance company Maintenance platoon Administrative troops Medical troops Veterinary company Field post office"}, {"id": "a-716", "group": "Organisatie", "title": "716. Division", "de": "716. Infanterie-Division", "summary": "History of our division: Normandy, southern France, Alsace and the end in 1945.", "html": "<p>The 716th Infantry Division was mobilized for occupation duties in the 15th Wave <a href=\"https://en.wikipedia.org/wiki/Replacement_Army\">Replacement Army<\/a> on 2 May 1941 in <a href=\"https://en.wikipedia.org/wiki/Wehrkreis_VI\">Wehrkreis VI<\/a> in Münster. After formation in <a href=\"https://en.wikipedia.org/wiki/Bielefeld\">Bielefeld<\/a>, and transfer to Occupied France, it was assigned to <a href=\"https://en.wikipedia.org/wiki/Armeeoberkommando\">AOK<\/a> 15 in June 1941 and employed at Saint-Lo and Soissons. It was transferred to the 7th Army in June 1942 and relocated to <a href=\"https://en.wikipedia.org/wiki/Normandy\">Normandy<\/a>, with duties including coastal defence, air raid protection and defensive fortification construction. After short movements to <a href=\"https://en.wikipedia.org/wiki/Amiens\">Amiens<\/a> and <a href=\"https://en.wikipedia.org/wiki/Brussels\">Brussels<\/a> it returned to Normandy. The 716th Division had no combat experience, and was one of the weakest divisions in the area.<\/p>\n<p>On <a href=\"https://en.wikipedia.org/wiki/D-Day\">D-Day<\/a>, the division was responsible for the Divisional Coastal Defensive Section <a href=\"https://en.wikipedia.org/wiki/Juno_Beach_order_of_battle#German_forces\">KVA Caen.<\/a> Having the task of defeating landings, it manned an extended line of defensible posts, along its assigned 47 km of Normandy Coast, and deployed all other unit resources then available above the Lower Normandy Calvados-Seine Bay Coastal Plain. Fighting with additionally allocated LXXXIV Corps resources, the tactical situation and the terrain saw the Division 'split' across two Regimental Coastal Defensive Sections: Coastal Defense Group Courseulles and Coastal Defense Group Riva-Bella. To the west, Coastal Defense Group Courseulles commanded all divisional troops from Asnelles to Saint-Aubin-sur-Mer, seeing it attempt to defeat landings at <a href=\"https://en.wikipedia.org/wiki/Gold_Beach\">Gold Beach<\/a> and <a href=\"https://en.wikipedia.org/wiki/Juno_Beach\">Juno Beach<\/a>. In the east up to the AOK 7 / AOK 15 Boundary, Coastal Defense Group Riva-Bella commanded the tactical situation from Langrune-sur-Mer to Le Home Varaville, becoming responsible to defeat landings at <a href=\"https://en.wikipedia.org/wiki/Sword_Beach\">Sword Beach<\/a> and by the <a href=\"https://en.wikipedia.org/wiki/6th_Airborne_Division_(United_Kingdom)\">British 6th Airborne Division<\/a>; astride the River Orne.<\/p>\n<p>During the fighting after D-Day, the division fought defensively around Caen and <a href=\"https://en.wikipedia.org/wiki/Villers-Bocage,_Calvados\">Villers-Bocage<\/a>. According to the commanding officer <a href=\"https://en.wikipedia.org/wiki/Generalleutnant\">Generalleutnant<\/a> Wilhelm Richter, \"My division had been defeated and badly beaten up in Normandy\". The division was removed from frontline duty on July 10, 1944, and was able to avoid the carnage of the <a href=\"https://en.wikipedia.org/wiki/Falaise_Pocket\">Falaise Pocket<\/a>. Redeployed to <a href=\"https://en.wikipedia.org/wiki/Southern_France\">southern France<\/a>, the division took up coastal security positions in the region of Salses-Perpignan-Elne, close to the <a href=\"https://en.wikipedia.org/wiki/France%E2%80%93Spain_border\">Spanish border<\/a>. Thereafter, the division was ordered to withdraw on August 19, 1944, and retreated through <a href=\"https://en.wikipedia.org/wiki/Languedoc\">Languedoc<\/a> to the region around <a href=\"https://en.wikipedia.org/wiki/Lyon\">Lyon<\/a>. After this movement the division was engaged by the <a href=\"https://en.wikipedia.org/wiki/French_resistance\">French resistance<\/a> before later arriving in the area of <a href=\"https://en.wikipedia.org/wiki/S%C3%A9lestat\">Sélestat<\/a> in <a href=\"https://en.wikipedia.org/wiki/Alsace\">Alsace<\/a>.<\/p>\n<p>In October 1944, the 716th Infantry Division was in the region of <a href=\"https://en.wikipedia.org/wiki/Oberrhein\">Oberrhein<\/a> (near <a href=\"https://en.wikipedia.org/wiki/Colmar_Pocket\">Colmar<\/a>) where it fought at Obenheim and was nearly wiped out in heavy fighting in January 1945. The remains of the division was reconstituted as the 716th <a href=\"https://en.wikipedia.org/wiki/Volksgrenadier\">Volksgrenadier<\/a> Division in April 1945 before surrendering to American troops at <a href=\"https://en.wikipedia.org/wiki/Kempten\">Kempten<\/a> in May 1945.<\/p>\n<aside class=\"note note-info\"><strong>D-Day detail.<\/strong> On 6 June 1944 most of Grenadier-Regiment 726 (I. and III. Bataillon) was not under the 716. Division but under the neighbouring 352. Infanterie-Division at Omaha. Oberst Ludwig Krug commanded Grenadier-Regiment 736 from the Hillman strongpoint and surrendered there on 7 June.<\/aside>\n<h3>Order of battle<\/h3>\n<p>The 716th's complement when raised in 1941 was:<\/p>\n<ul>\n<li><p>Divisional Staff<\/p><\/li>\n<li><p>726 Infantry Regiment<\/p><\/li>\n<li><p>736 Infantry Regiment<\/p><\/li>\n<li><p>716 Artillery Regiment<\/p><\/li>\n<li><p>716 <a href=\"https://en.wikipedia.org/wiki/Panzerj%C3%A4ger\">Panzerjäger<\/a> Company<\/p><\/li>\n<li><p>716 Pioneer Battalion<\/p><\/li>\n<li><p>716 Signals Battalion<\/p><\/li>\n<li><p>716 Supply Troops<\/p><\/li>\n<li><p>Administration Platoon<\/p><\/li>\n<\/ul>\n<p>The 716th's complement during the June 1944 <a href=\"https://en.wikipedia.org/wiki/Operation_Overlord\">Normandy Campaign<\/a> consisted of:<\/p>\n<ul>\n<li><p>Command<\/p><\/li>\n<li><p>726th Grenadier Regiment (439th <a href=\"https://en.wikipedia.org/wiki/Ostlegionen\">Ost Battalion<\/a>)<\/p><\/li>\n<li><p>736th Grenadier Regiment (642nd Ost Battalion)<\/p><\/li>\n<li><p>Artillerie-Regiment 1716<\/p><\/li>\n<li><p>716th Antitank Battalion<\/p><\/li>\n<li><p>716th Engineer Battalion<\/p><\/li>\n<li><p>716th Signals Battalion<\/p><\/li>\n<li><p>716th Fusilier Battalion<\/p><\/li>\n<li><p>441st Ost Battalion<\/p><\/li>\n<\/ul>\n<h3>Commanders<\/h3>\n<ul>\n<li><p>Oberst Otto Matterstock: 1941 to April 1943<\/p><\/li>\n<li><p>Generalleutnant <a href=\"https://en.wikipedia.org/wiki/Wilhelm_Richter\">Wilhelm Richter<\/a>: April 1943 − August 1944<\/p><\/li>\n<li><p>Generalmajor Otto Schiel (1895–1990): August − September 1944<\/p><\/li>\n<li><p>Generalleutnant Wilhelm Richter: September 1944<\/p><\/li>\n<li><p>Oberst Ernst von Bauer (1896–1945): September − December 1944<\/p><\/li>\n<li><p>Generalmajor <a href=\"https://en.wikipedia.org/wiki/Wolf_Ewert\">Wolf Ewert<\/a> (1905–1994): December 1944 – April 1945<\/p><\/li>\n<li><p>Oberst Friedrich Trompeter: April 1945<\/p><\/li>\n<\/ul>", "text": "The 716th Infantry Division was mobilized for occupation duties in the 15th Wave Replacement Army on 2 May 1941 in Wehrkreis VI in Münster. After formation in Bielefeld , and transfer to Occupied France, it was assigned to AOK 15 in June 1941 and employed at Saint-Lo and Soissons. It was transferred to the 7th Army in June 1942 and relocated to Normandy , with duties including coastal defence, air raid protection and defensive fortification construction. After short movements to Amiens and Brussels it returned to Normandy. The 716th Division had no combat experience, and was one of the weakest divisions in the area. On D-Day , the division was responsible for the Divisional Coastal Defensive Section KVA Caen. Having the task of defeating landings, it manned an extended line of defensible posts, along its assigned 47 km of Normandy Coast, and deployed all other unit resources then available above the Lower Normandy Calvados-Seine Bay Coastal Plain. Fighting with additionally allocated LXXXIV Corps resources, the tactical situation and the terrain saw the Division 'split' across two Regimental Coastal Defensive Sections: Coastal Defense Group Courseulles and Coastal Defense Group Riva-Bella. To the west, Coastal Defense Group Courseulles commanded all divisional troops from Asnelles to Saint-Aubin-sur-Mer, seeing it attempt to defeat landings at Gold Beach and Juno Beach . In the east up to the AOK 7 / AOK 15 Boundary, Coastal Defense Group Riva-Bella commanded the tactical situation from Langrune-sur-Mer to Le Home Varaville, becoming responsible to defeat landings at Sword Beach and by the British 6th Airborne Division ; astride the River Orne. During the fighting after D-Day, the division fought defensively around Caen and Villers-Bocage . According to the commanding officer Generalleutnant Wilhelm Richter, \"My division had been defeated and badly beaten up in Normandy\". The division was removed from frontline duty on July 10, 1944, and was able to avoid the carnage of the Falaise Pocket . Redeployed to southern France , the division took up coastal security positions in the region of Salses-Perpignan-Elne, close to the Spanish border . Thereafter, the division was ordered to withdraw on August 19, 1944, and retreated through Languedoc to the region around Lyon . After this movement the division was engaged by the French resistance before later arriving in the area of Sélestat in Alsace . In October 1944, the 716th Infantry Division was in the region of Oberrhein (near Colmar ) where it fought at Obenheim and was nearly wiped out in heavy fighting in January 1945. The remains of the division was reconstituted as the 716th Volksgrenadier Division in April 1945 before surrendering to American troops at Kempten in May 1945. D-Day detail. On 6 June 1944 most of Grenadier-Regiment 726 (I. and III. Bataillon) was not under the 716. Division but under the neighbouring 352. Infanterie-Division at Omaha. Oberst Ludwig Krug commanded Grenadier-Regiment 736 from the Hillman strongpoint and surrendered there on 7 June. Order of battle The 716th's complement when raised in 1941 was: Divisional Staff 726 Infantry Regiment 736 Infantry Regiment 716 Artillery Regiment 716 Panzerjäger Company 716 Pioneer Battalion 716 Signals Battalion 716 Supply Troops Administration Platoon The 716th's complement during the June 1944 Normandy Campaign consisted of: Command 726th Grenadier Regiment (439th Ost Battalion ) 736th Grenadier Regiment (642nd Ost Battalion) Artillerie-Regiment 1716 716th Antitank Battalion 716th Engineer Battalion 716th Signals Battalion 716th Fusilier Battalion 441st Ost Battalion Commanders Oberst Otto Matterstock: 1941 to April 1943 Generalleutnant Wilhelm Richter : April 1943 − August 1944 Generalmajor Otto Schiel (1895–1990): August − September 1944 Generalleutnant Wilhelm Richter: September 1944 Oberst Ernst von Bauer (1896–1945): September − December 1944 Generalmajor Wolf Ewert (1905–1994): December 1944 – April 1945 Oberst Friedrich Trompeter: April 1945"}, {"id": "benehmen", "group": "Dienst", "title": "Conduct and honours", "de": "Benehmen und Ehrenbezeigungen", "summary": "How to address superiors, how to salute and how to behave in public.", "html": "<aside class=\"note note-warn\"><strong>From July 1944:<\/strong> after the 20 July plot the Deutscher Gruß (raised arm) replaced the military salute throughout the Wehrmacht. <em>Our group does not use it, ever.<\/em> We keep the hand-to-headgear salute described below.<\/aside>\n<p>A soldier’s conduct is the measuring stick of his training and discipline. Whether in or out of uniform, on or off duty, every soldier represents the honor of the Wehrmacht and his unit.<\/p>\n<p>1. Forms of Address (<em>Anrede<\/em>)<\/p>\n<p>Superiors must always be addressed by their rank preceded by \"Herr\" (e.g., \"<em>Herr Unteroffizier<\/em>\", \"<em>Herr Hauptmann<\/em>\"). There are specific exceptions for high-ranking positions:<\/p>\n<ul>\n<li><p>The Führer: Always addressed as \"Mein Führer\".<\/p><\/li>\n<li><p>General Field Marshals: \"Herr Generalfeldmarschall\".<\/p><\/li>\n<li><p>Generals: All general-grade officers (except Generaloberst) are addressed simply as \"Herr General\".<\/p><\/li>\n<li><p>Navy Staff Officers: Addressed as \"Herr Kapitän\" regardless of specific rank.<\/p><\/li>\n<\/ul>\n<p>When answering a superior, soldiers must use \"Jawohl\" or \"Nein\" (or \"Zu Befehl\") followed by the superior’s rank. It is un-soldierly to use the word \"Sie\" (you) without a preceding or immediate following \"Herr [Rank]\".<\/p>\n<p>2. Physical Execution of Honors (<em>Ehrenbezeigungen<\/em>)<\/p>\n<p>Military honors are an expression of brotherhood, respect, and discipline. They must be executed sharply, with a stiff posture and the head turned toward the superior.<\/p>\n<p>The Salute with Headgear (<em>Grüßen mit Kopfbedeckung<\/em>):<\/p>\n<ul>\n<li><p>Stationary: Snap to attention (<em>Stillgestanden<\/em>). Raise the right hand to the headgear. The fingertips of the index and middle fingers should touch the edge of the headgear above the outer corner of the right eye. The palm faces the body, and the elbow is held at shoulder height.<\/p><\/li>\n<li><p>In Motion: The salute begins six paces before reaching the superior and ends two paces after passing. The soldier continues walking but does not swing the right arm.<\/p><\/li>\n<\/ul>\n<h3>3. Personal Interaction with Superiors<\/h3>\n<ul>\n<li><p>When Addressed: The soldier immediately snaps to attention facing the superior. Answers must be in short, complete sentences. The soldier must look the superior clearly and calmly in the eye.<\/p><\/li>\n<li><p>When Called: If a superior calls (e.g., \"<em>Schütze Müller!<\/em>\"), the soldier answers loudly, \"Hier, Herr [Rank]!\" and moves to them via the shortest path. He stops exactly three paces away and stands at attention.<\/p><\/li>\n<li><p>Receiving Orders: A soldier is expected to repeat an order word-for-word (<em>wörtlich zu wiederholen<\/em>) before executing it to ensure there is no misunderstanding.<\/p><\/li>\n<li><p>Dismissal: Upon being dismissed, the soldier performs a sharp about-face (<em>stramme Kehrtwendung<\/em>) and departs.<\/p><\/li>\n<\/ul>\n<p>4. Conduct in Public (<em>Verhalten in der Öffentlichkeit<\/em>)<\/p>\n<p>A soldier on leave is a representative of his unit.<\/p>\n<ul>\n<li><p>Appearance: Uniforms must be clean, buttons closed, and headgear worn straight. Hands must never be in pockets.<\/p><\/li>\n<li><p>Yielding: Soldiers must yield the sidewalk to superiors or elderly civilians as a sign of respect.<\/p><\/li>\n<li><p>Alcohol and Tobacco: Soldiers are expected to practice restraint (<em>Enthaltsamkeit<\/em>). Drunkenness is a stain on the unit’s honor. Smoking is forbidden while saluting or performing official reporting duties.<\/p><\/li>\n<li><p>Entering Establishments: When entering a restaurant or theater, the soldier must remove his headgear, belt, and sidearm if a cloakroom is available.<\/p><\/li>\n<\/ul>", "text": "From July 1944: after the 20 July plot the Deutscher Gruß (raised arm) replaced the military salute throughout the Wehrmacht. Our group does not use it, ever. We keep the hand-to-headgear salute described below. A soldier’s conduct is the measuring stick of his training and discipline. Whether in or out of uniform, on or off duty, every soldier represents the honor of the Wehrmacht and his unit. 1. Forms of Address ( Anrede ) Superiors must always be addressed by their rank preceded by \"Herr\" (e.g., \" Herr Unteroffizier \", \" Herr Hauptmann \"). There are specific exceptions for high-ranking positions: The Führer: Always addressed as \"Mein Führer\". General Field Marshals: \"Herr Generalfeldmarschall\". Generals: All general-grade officers (except Generaloberst) are addressed simply as \"Herr General\". Navy Staff Officers: Addressed as \"Herr Kapitän\" regardless of specific rank. When answering a superior, soldiers must use \"Jawohl\" or \"Nein\" (or \"Zu Befehl\") followed by the superior’s rank. It is un-soldierly to use the word \"Sie\" (you) without a preceding or immediate following \"Herr [Rank]\". 2. Physical Execution of Honors ( Ehrenbezeigungen ) Military honors are an expression of brotherhood, respect, and discipline. They must be executed sharply, with a stiff posture and the head turned toward the superior. The Salute with Headgear ( Grüßen mit Kopfbedeckung ): Stationary: Snap to attention ( Stillgestanden ). Raise the right hand to the headgear. The fingertips of the index and middle fingers should touch the edge of the headgear above the outer corner of the right eye. The palm faces the body, and the elbow is held at shoulder height. In Motion: The salute begins six paces before reaching the superior and ends two paces after passing. The soldier continues walking but does not swing the right arm. 3. Personal Interaction with Superiors When Addressed: The soldier immediately snaps to attention facing the superior. Answers must be in short, complete sentences. The soldier must look the superior clearly and calmly in the eye. When Called: If a superior calls (e.g., \" Schütze Müller! \"), the soldier answers loudly, \"Hier, Herr [Rank]!\" and moves to them via the shortest path. He stops exactly three paces away and stands at attention. Receiving Orders: A soldier is expected to repeat an order word-for-word ( wörtlich zu wiederholen ) before executing it to ensure there is no misunderstanding. Dismissal: Upon being dismissed, the soldier performs a sharp about-face ( stramme Kehrtwendung ) and departs. 4. Conduct in Public ( Verhalten in der Öffentlichkeit ) A soldier on leave is a representative of his unit. Appearance: Uniforms must be clean, buttons closed, and headgear worn straight. Hands must never be in pockets. Yielding: Soldiers must yield the sidewalk to superiors or elderly civilians as a sign of respect. Alcohol and Tobacco: Soldiers are expected to practice restraint ( Enthaltsamkeit ). Drunkenness is a stain on the unit’s honor. Smoking is forbidden while saluting or performing official reporting duties. Entering Establishments: When entering a restaurant or theater, the soldier must remove his headgear, belt, and sidearm if a cloakroom is available."}, {"id": "mannschaften", "group": "Rangen", "title": "Enlisted ranks", "de": "Mannschaften", "summary": "Schütze to Stabsgefreiter, with shoulder straps and sleeve chevrons.", "html": "<aside class=\"note note-info\"><strong>Schütze or Grenadier?<\/strong> The lowest infantry rank was Schütze. From 15 October 1942 infantry regiments became Grenadier-Regimenter and the Schütze became a Grenadier (Oberschütze → Obergrenadier). Other arms had their own titles: Füsilier, Jäger, Kanonier, Pionier, Funker. \"Landser\" is soldiers' slang, not a rank.<\/aside>\n<div class=\"tw\"><table>\n<tr data-k=\"h\" class=\"header\">\n<th colspan=\"2\">Insignia<\/th>\n<th rowspan=\"2\">Rank<\/th>\n<th rowspan=\"2\"><img src=\"media/image14.png\" alt=\"\" loading=\"lazy\" /><\/th>\n<\/tr>\n<tr data-k=\"h\" class=\"odd\">\n<th>Shoulder<\/th>\n<th>Sleeve<\/th>\n<\/tr>\n<tr>\n<th><img src=\"media/image44.png\" alt=\"\" loading=\"lazy\" /><\/th>\n<th><\/th>\n<th><p><a href=\"https://en.wikipedia.org/wiki/Soldat_(rank)\">Soldat<\/a><\/p>\n<p>Schütze<\/p>\n<p>Grenadier (infantry, from Oct. 1942)<\/p><\/th>\n<th>Soldat was the generic term; for actual ranks see <a href=\"https://en.wikipedia.org/wiki/Ranks_and_insignia_of_the_German_Army_(1935%E2%80%931945)#Ranks_at_the_Private/Senior_Private_levels\">below<\/a>. It could be advanced directly to <a href=\"https://en.wikipedia.org/wiki/Gefreiter\">Gefreiter<\/a>.<\/th>\n<\/tr>\n<tr>\n<th><img src=\"media/image30.png\" alt=\"\" loading=\"lazy\" /><\/th>\n<th><\/th>\n<th><p>Soldat<\/p>\n<p>(Unteroffizieranwärter UA)<\/p><\/th>\n<th>Soldier selected for or attending Unteroffizierschule (NCO school); could be of any rank from Soldat through <a href=\"https://en.wikipedia.org/wiki/Stabsgefreiter\">Stabsgefreiter<\/a>.<\/th>\n<\/tr>\n<tr>\n<th><img src=\"media/image27.png\" alt=\"\" loading=\"lazy\" /><\/th>\n<th><\/th>\n<th><p>Soldat<\/p>\n<p>(Offizieranwärter OA)<\/p><\/th>\n<th>See <a href=\"https://en.wikipedia.org/wiki/Ranks_and_insignia_of_the_German_Army_(1935%E2%80%931945)#Officer_candidates_(F%C3%A4hnriche)\">below<\/a><\/th>\n<\/tr>\n<tr>\n<th><img src=\"media/image44.png\" alt=\"\" loading=\"lazy\" /><\/th>\n<th><img src=\"media/image64.png\" alt=\"\" loading=\"lazy\" /><\/th>\n<th><p><a href=\"https://en.wikipedia.org/wiki/Oberschutze\">Obersoldat<\/a><\/p>\n<p>(from 1936)<\/p><\/th>\n<th>Obersoldat was the generic term; for actual ranks see <a href=\"https://en.wikipedia.org/wiki/Ranks_and_insignia_of_the_German_Army_(1935%E2%80%931945)#Ranks_at_the_Private/Senior_Private_levels\">below<\/a>. Automatic after 12 (later 6) months if not yet advanced to Gefreiter.<\/th>\n<\/tr>\n<tr>\n<th><img src=\"media/image44.png\" alt=\"\" loading=\"lazy\" /><\/th>\n<th><img src=\"media/image46.png\" alt=\"\" loading=\"lazy\" /><\/th>\n<th><a href=\"https://en.wikipedia.org/wiki/Gefreiter\">Gefreiter<\/a><\/th>\n<th>Historically in German armies, a Gefreiter was an experienced soldier who by virtue of seniority was exempted from more menial duties.<\/th>\n<\/tr>\n<tr>\n<th><img src=\"media/image27.png\" alt=\"\" loading=\"lazy\" /><\/th>\n<th><img src=\"media/image46.png\" alt=\"\" loading=\"lazy\" /><\/th>\n<th><p>Gefreiter<\/p>\n<p>(Offizieranwärter OA)<\/p><\/th>\n<th>See <a href=\"https://en.wikipedia.org/wiki/Ranks_and_insignia_of_the_German_Army_(1935%E2%80%931945)#Officer_candidates,_F%C3%A4hnrich\">below<\/a><\/th>\n<\/tr>\n<tr>\n<th><img src=\"media/image44.png\" alt=\"\" loading=\"lazy\" /><\/th>\n<th><p><img src=\"media/image60.png\" alt=\"\" loading=\"lazy\" /><\/p>\n<p><img src=\"media/image54.png\" alt=\"\" loading=\"lazy\" /><\/p><\/th>\n<th><a href=\"https://en.wikipedia.org/wiki/Obergefreiter\">Obergefreiter<\/a><\/th>\n<th>Second sleeve insignia indicates 6 years of service.<\/th>\n<\/tr>\n<tr>\n<th><img src=\"media/image44.png\" alt=\"\" loading=\"lazy\" /><\/th>\n<th><img src=\"media/image6.png\" alt=\"\" loading=\"lazy\" /><\/th>\n<th><a href=\"https://en.wikipedia.org/wiki/Stabsgefreiter\">Stabsgefreiter<\/a> (from 1942)<\/th>\n<th>The rank was commonly trusted with positions in food provision supply and <a href=\"https://en.wikipedia.org/wiki/Quartermaster\">quartermaster<\/a> duties. In the last years of World War II Stabsgefreiters were often used as group leaders Gruppenführer due to a lack of Unteroffiziere (NCOs). Promotions to this rank were suspended in 1934, although existing Stabsgefreiters retained it; promotions resumed in 1942.<\/th>\n<\/tr>\n<\/table><\/div>", "text": "Schütze or Grenadier? The lowest infantry rank was Schütze. From 15 October 1942 infantry regiments became Grenadier-Regimenter and the Schütze became a Grenadier (Oberschütze → Obergrenadier). Other arms had their own titles: Füsilier, Jäger, Kanonier, Pionier, Funker. \"Landser\" is soldiers' slang, not a rank. Insignia Rank Shoulder Sleeve Soldat Schütze Grenadier (infantry, from Oct. 1942) Soldat was the generic term; for actual ranks see below . It could be advanced directly to Gefreiter . Soldat (Unteroffizieranwärter UA) Soldier selected for or attending Unteroffizierschule (NCO school); could be of any rank from Soldat through Stabsgefreiter . Soldat (Offizieranwärter OA) See below Obersoldat (from 1936) Obersoldat was the generic term; for actual ranks see below . Automatic after 12 (later 6) months if not yet advanced to Gefreiter. Gefreiter Historically in German armies, a Gefreiter was an experienced soldier who by virtue of seniority was exempted from more menial duties. Gefreiter (Offizieranwärter OA) See below Obergefreiter Second sleeve insignia indicates 6 years of service. Stabsgefreiter (from 1942) The rank was commonly trusted with positions in food provision supply and quartermaster duties. In the last years of World War II Stabsgefreiters were often used as group leaders Gruppenführer due to a lack of Unteroffiziere (NCOs). Promotions to this rank were suspended in 1934, although existing Stabsgefreiters retained it; promotions resumed in 1942."}, {"id": "unteroffiziere", "group": "Rangen", "title": "NCO ranks", "de": "Unteroffiziere", "summary": "Unteroffizier to Stabsfeldwebel, with and without Portepee.", "html": "<p><img src=\"media/image20.png\" alt=\"\" loading=\"lazy\" /><\/p>\n<div class=\"tw\"><table>\n<tr data-k=\"h\" class=\"header\">\n<th colspan=\"2\">Insignia<\/th>\n<th rowspan=\"2\">Rank<\/th>\n<th rowspan=\"2\"><\/th>\n<\/tr>\n<tr data-k=\"h\" class=\"odd\">\n<th>Shoulder<\/th>\n<th>Sleeve<\/th>\n<\/tr>\n<tr data-k=\"g\" class=\"header\">\n<th colspan=\"4\">Unteroffiziere ohne Portepee (Junior NCOs)<\/th>\n<\/tr>\n<tr>\n<th><img src=\"media/image35.png\" alt=\"\" loading=\"lazy\" /><\/th>\n<th rowspan=\"2\"><img src=\"media/image5.png\" alt=\"\" loading=\"lazy\" /><\/th>\n<th><p><a href=\"https://en.wikipedia.org/wiki/Unteroffizier\">Unteroffizier<\/a><\/p>\n<p>Oberjäger (Light and mountain infantry)<\/p><\/th>\n<th>Originally only upon completion of NCO school; later also an automatic promotion for acting squad leaders with 4 months of combat experience. Could be advanced directly to Feldwebel / Wachtmeister.<\/th>\n<\/tr>\n<tr>\n<th><img src=\"media/image63.png\" alt=\"\" loading=\"lazy\" /><\/th>\n<th><p><a href=\"https://en.wikipedia.org/wiki/Fahnenjunker\">Fahnenjunker<\/a>-Unteroffizier<\/p>\n<p>(Offiziersanwärter OA)<\/p><\/th>\n<th>Unteroffizier shoulder board, additional with two silver strips<\/th>\n<\/tr>\n<tr>\n<th><img src=\"media/image34.png\" alt=\"\" loading=\"lazy\" /><\/th>\n<th rowspan=\"2\"><img src=\"media/image57.png\" alt=\"\" loading=\"lazy\" /><\/th>\n<th><p><a href=\"https://en.wikipedia.org/wiki/Unterfeldwebel\">Unterfeldwebel<\/a><\/p>\n<p><a href=\"https://en.wikipedia.org/wiki/Wachtmeister\">Unterwachtmeister<\/a><\/p><\/th>\n<th>Called Sergeant until 1921. Automatically after 6 years of service and 3 years as an Unteroffizier if not yet advanced to Feldwebel / Wachtmeister.<\/th>\n<\/tr>\n<tr>\n<th><img src=\"media/image62.png\" alt=\"\" loading=\"lazy\" /><\/th>\n<th><p><a href=\"https://en.wikipedia.org/wiki/Fahnenjunker\">Fahnenjunker<\/a>-Unterfeldwebel<\/p>\n<p>(Offiziersanwärter OA)<\/p><\/th>\n<th>Unterfeldwebel shoulder board, additional with two silver strips<\/th>\n<\/tr>\n<tr data-k=\"g\" class=\"odd\">\n<th colspan=\"4\">Unteroffiziere mit Portepee (Senior NCOs)<\/th>\n<\/tr>\n<tr>\n<th><img src=\"media/image56.png\" alt=\"\" loading=\"lazy\" /><\/th>\n<th rowspan=\"2\"><img src=\"media/image11.png\" alt=\"\" loading=\"lazy\" /><\/th>\n<th><p><a href=\"https://en.wikipedia.org/wiki/Feldwebel\">Feldwebel<\/a><\/p>\n<p><a href=\"https://en.wikipedia.org/wiki/Wachtmeister\">Wachtmeister<\/a><\/p><\/th>\n<th>From mid-war an automatic promotion for acting platoon leaders with 4 months of combat experience.<\/th>\n<\/tr>\n<tr>\n<th><img src=\"media/image49.png\" alt=\"\" loading=\"lazy\" /><\/th>\n<th><p><a href=\"https://en.wikipedia.org/wiki/Fahnenjunker\">Fahnenjunker<\/a>-Feldwebel<\/p>\n<p>(Offiziersanwärter OA)<\/p><\/th>\n<th>Feldwebel shoulder board, additional with two silver strips<\/th>\n<\/tr>\n<tr>\n<th><img src=\"media/image61.png\" alt=\"\" loading=\"lazy\" /><\/th>\n<th rowspan=\"2\"><img src=\"media/image26.png\" alt=\"\" loading=\"lazy\" /><\/th>\n<th><p><a href=\"https://en.wikipedia.org/wiki/Oberfeldwebel\">Oberfeldwebel<\/a><\/p>\n<p><a href=\"https://en.wikipedia.org/wiki/Wachtmeister\">Oberwachtmeister<\/a><\/p><\/th>\n<th><a href=\"https://en.wikipedia.org/wiki/Hauptfeldwebel\">Hauptfeldwebel<\/a> (First Sergeant/CSM) was normally of this rank.<\/th>\n<\/tr>\n<tr>\n<th><img src=\"media/image39.png\" alt=\"\" loading=\"lazy\" /><\/th>\n<th><p><a href=\"https://en.wikipedia.org/wiki/Fahnenjunker\">Fahnenjunker<\/a>-Oberfeldwebel<\/p>\n<p>(Offiziersanwärter OA)<\/p><\/th>\n<th>Oberfeldwebel shoulder board (additional with two silver strips), worn with officer's uniform<\/th>\n<\/tr>\n<tr>\n<th><img src=\"media/image55.png\" alt=\"\" loading=\"lazy\" /><\/th>\n<th rowspan=\"2\"><img src=\"media/image22.png\" alt=\"\" loading=\"lazy\" /><\/th>\n<th><p><a href=\"https://en.wikipedia.org/wiki/Stabsfeldwebel\">Stabsfeldwebel<\/a><\/p>\n<p><a href=\"https://en.wikipedia.org/wiki/Wachtmeister\">Stabswachtmeister<\/a><\/p><\/th>\n<th>Restricted to career volunteers; automatically after 12 years of service. Rank created in 1938.<\/th>\n<\/tr>\n<tr>\n<th><img src=\"media/image68.png\" alt=\"\" loading=\"lazy\" /><\/th>\n<th><p><a href=\"https://en.wikipedia.org/wiki/Fahnenjunker\">Fahnenjunker<\/a>-Stabsfeldwebel<\/p>\n<p>(Offiziersanwärter OA)<\/p><\/th>\n<th>Stabsfeldwebel shoulder board (additional with two silver strips), worn with officer's uniform<\/th>\n<\/tr>\n<\/table><\/div>", "text": "Insignia Rank Shoulder Sleeve Unteroffiziere ohne Portepee (Junior NCOs) Unteroffizier Oberjäger (Light and mountain infantry) Originally only upon completion of NCO school; later also an automatic promotion for acting squad leaders with 4 months of combat experience. Could be advanced directly to Feldwebel / Wachtmeister. Fahnenjunker -Unteroffizier (Offiziersanwärter OA) Unteroffizier shoulder board, additional with two silver strips Unterfeldwebel Unterwachtmeister Called Sergeant until 1921. Automatically after 6 years of service and 3 years as an Unteroffizier if not yet advanced to Feldwebel / Wachtmeister. Fahnenjunker -Unterfeldwebel (Offiziersanwärter OA) Unterfeldwebel shoulder board, additional with two silver strips Unteroffiziere mit Portepee (Senior NCOs) Feldwebel Wachtmeister From mid-war an automatic promotion for acting platoon leaders with 4 months of combat experience. Fahnenjunker -Feldwebel (Offiziersanwärter OA) Feldwebel shoulder board, additional with two silver strips Oberfeldwebel Oberwachtmeister Hauptfeldwebel (First Sergeant/CSM) was normally of this rank. Fahnenjunker -Oberfeldwebel (Offiziersanwärter OA) Oberfeldwebel shoulder board (additional with two silver strips), worn with officer's uniform Stabsfeldwebel Stabswachtmeister Restricted to career volunteers; automatically after 12 years of service. Rank created in 1938. Fahnenjunker -Stabsfeldwebel (Offiziersanwärter OA) Stabsfeldwebel shoulder board (additional with two silver strips), worn with officer's uniform"}, {"id": "offiziere", "group": "Rangen", "title": "Officer ranks", "de": "Offiziere", "summary": "Leutnant to Oberst, with the matching medical, veterinary and judicial ranks.", "html": "<div class=\"tw\"><table>\n<tr data-k=\"h\" class=\"header\">\n<th colspan=\"2\">Insignia<\/th>\n<th rowspan=\"2\"><img src=\"media/image29.png\" alt=\"\" loading=\"lazy\" /><\/th>\n<\/tr>\n<tr data-k=\"h\" class=\"odd\">\n<th>Shoulder<\/th>\n<th>Sleeve<\/th>\n<\/tr>\n<tr data-k=\"g\" class=\"header\">\n<th colspan=\"3\">Leutnante<\/th>\n<\/tr>\n<tr>\n<th><img src=\"media/image17.png\" alt=\"\" loading=\"lazy\" /><\/th>\n<th><img src=\"media/image40.png\" alt=\"\" loading=\"lazy\" /><\/th>\n<th><p><a href=\"https://en.wikipedia.org/wiki/Leutnant\">Leutnant<\/a><\/p>\n<p><a href=\"https://en.wikipedia.org/wiki/Assistenzarzt_(military)\">Assistenzarzt<\/a> (Medical)<\/p>\n<p>Veterinär (Veterinary)<\/p><\/th>\n<\/tr>\n<tr>\n<th><img src=\"media/image12.png\" alt=\"\" loading=\"lazy\" /><\/th>\n<th><img src=\"media/image48.png\" alt=\"\" loading=\"lazy\" /><\/th>\n<th><p><a href=\"https://en.wikipedia.org/wiki/Oberleutnant\">Oberleutnant<\/a><\/p>\n<p><a href=\"https://en.wikipedia.org/wiki/Oberarzt_(military)\">Oberarzt<\/a> (Medical)<\/p>\n<p>Oberveterinär (Veterinary)<\/p><\/th>\n<\/tr>\n<tr data-k=\"g\" class=\"odd\">\n<th colspan=\"3\">Hauptleute<\/th>\n<\/tr>\n<tr>\n<th><img src=\"media/image21.png\" alt=\"\" loading=\"lazy\" /><\/th>\n<th><img src=\"media/image43.png\" alt=\"\" loading=\"lazy\" /><\/th>\n<th><p><a href=\"https://en.wikipedia.org/wiki/Hauptmann\">Hauptmann<\/a><\/p>\n<p><a href=\"https://en.wikipedia.org/wiki/Rittmeister\">Rittmeister<\/a> (Mounted branches)<\/p>\n<p><a href=\"https://en.wikipedia.org/wiki/Stabsarzt\">Stabsarzt<\/a> (Medical)<\/p>\n<p>Stabsveterinär (Veterinary)<\/p>\n<p><a href=\"https://de.wikipedia.org/wiki/Milit%C3%A4rgerichtsbarkeit_(Nationalsozialismus)#:~:text=entsprechender_Milit%C3%A4rrang-,Kriegsrichter,-Stabsrichter\">Kriegsrichter<\/a> (Judicial before 1944)<\/p>\n<p><a href=\"https://de.wikipedia.org/wiki/Milit%C3%A4rgerichtsbarkeit_(Nationalsozialismus)#:~:text=Kriegsgerichtsrat_(im_Hauptmannsrang)\">Kriegsgerichtsrat im Hauptmannsrang<\/a> (Judicial before 1944)<br />\nStabsrichter (Judicial after 1944)<br />\nHeereshilfspfarrer (<a href=\"https://en.wikipedia.org/wiki/Chaplain\">Chaplain<\/a>)<\/p><\/th>\n<\/tr>\n<tr data-k=\"g\" class=\"odd\">\n<th colspan=\"3\">Stabsoffiziere<\/th>\n<\/tr>\n<tr>\n<th><img src=\"media/image4.png\" alt=\"\" loading=\"lazy\" /><\/th>\n<th><img src=\"media/image2.png\" alt=\"\" loading=\"lazy\" /><\/th>\n<th><p><a href=\"https://en.wikipedia.org/wiki/Major_(Germany)\">Major<\/a><\/p>\n<p><a href=\"https://en.wikipedia.org/wiki/Oberstabsarzt\">Oberstabsarzt<\/a> (Medical)<\/p>\n<p>Oberstabsveterinär (Veterinary)<\/p>\n<p><a href=\"https://de.wikipedia.org/wiki/Milit%C3%A4rgerichtsbarkeit_(Nationalsozialismus)#:~:text=Kriegsgerichtsrat_(im_Hauptmannsrang)-,Kriegsgerichtsrat,-(im_Majorsrang)\">Kriegsgerichtsrat im Majorsrang<\/a> (Judicial before 1944)<br />\nOberstabsrichter (Judicial after 1944)<br />\nHeerespfarrer (Chaplain)<\/p><\/th>\n<\/tr>\n<tr>\n<th><img src=\"media/image24.png\" alt=\"\" loading=\"lazy\" /><\/th>\n<th><img src=\"media/image67.png\" alt=\"\" loading=\"lazy\" /><\/th>\n<th><p><a href=\"https://en.wikipedia.org/wiki/Oberstleutnant\">Oberstleutnant<\/a><\/p>\n<p><a href=\"https://en.wikipedia.org/wiki/Oberfeldarzt\">Oberfeldarzt<\/a> (Medical)<\/p>\n<p>Oberfeldveterinär (Veterinary)<\/p>\n<p><a href=\"https://de.wikipedia.org/wiki/Milit%C3%A4rgerichtsbarkeit_(Nationalsozialismus)#:~:text=Major_/_Korvettenkapit%C3%A4n-,Oberkriegsgerichtsrat,-Oberfeldrichter_/_Geschwaderrichter\">Oberkriegsgerichtsrat<\/a> (Judicial before 1944)<br />\nOberrichter (Judicial after 1944)<br />\nHeeresoberpfarrer (Chaplain)<\/p><\/th>\n<\/tr>\n<tr>\n<th><img src=\"media/image9.png\" alt=\"\" loading=\"lazy\" /><\/th>\n<th><img src=\"media/image19.png\" alt=\"\" loading=\"lazy\" /><\/th>\n<th><p><a href=\"https://en.wikipedia.org/wiki/Oberst\">Oberst<\/a><\/p>\n<p><a href=\"https://en.wikipedia.org/wiki/Oberstarzt\">Oberstarzt<\/a> (Medical)<\/p>\n<p>Oberstveterinär (Veterinary)<\/p>\n<p><a href=\"https://de.wikipedia.org/wiki/Milit%C3%A4rgerichtsbarkeit_(Nationalsozialismus)#:~:text=Oberstleutnant_/_Fregattenkapit%C3%A4n-,Oberstkriegsgerichtsrat,-Oberstrichter_/_Flottenrichter\">Oberstkriegsgerichtsrat<\/a> (Judicial before 1944)<br />\nOberstrichter (Judicial after 1944)<br />\nWehrmachtsdekan (Chaplain)<\/p><\/th>\n<\/tr>\n<\/table><\/div>", "text": "Insignia Shoulder Sleeve Leutnante Leutnant Assistenzarzt (Medical) Veterinär (Veterinary) Oberleutnant Oberarzt (Medical) Oberveterinär (Veterinary) Hauptleute Hauptmann Rittmeister (Mounted branches) Stabsarzt (Medical) Stabsveterinär (Veterinary) Kriegsrichter (Judicial before 1944) Kriegsgerichtsrat im Hauptmannsrang (Judicial before 1944) Stabsrichter (Judicial after 1944) Heereshilfspfarrer ( Chaplain ) Stabsoffiziere Major Oberstabsarzt (Medical) Oberstabsveterinär (Veterinary) Kriegsgerichtsrat im Majorsrang (Judicial before 1944) Oberstabsrichter (Judicial after 1944) Heerespfarrer (Chaplain) Oberstleutnant Oberfeldarzt (Medical) Oberfeldveterinär (Veterinary) Oberkriegsgerichtsrat (Judicial before 1944) Oberrichter (Judicial after 1944) Heeresoberpfarrer (Chaplain) Oberst Oberstarzt (Medical) Oberstveterinär (Veterinary) Oberstkriegsgerichtsrat (Judicial before 1944) Oberstrichter (Judicial after 1944) Wehrmachtsdekan (Chaplain)"}, {"id": "exerzieren", "group": "Exerzieren", "title": "Drill and weapons", "de": "Exerzier- und Waffenausbildung", "summary": "Stance, rifle drill, formations, turns and the commands for the MG.", "html": "<h3>1. Basic Stance and Rest<\/h3>\n<p>\"Stillgestanden!\" (Attention!): The soldier assumes the basic, motionless stance with heels together, chest out, and eyes straight ahead.<\/p>\n<p>\"Rührt Euch!\" (Stand at ease!): The soldier places his left foot forward, relaxes his stance, but remains still and may not speak without permission.<\/p>\n<p>\"Achtung!\" (Attention!): An announcement command that forces soldiers to immediately assume the basic stance, even if no formal \"Stillgestanden\" command has been given.<\/p>\n<p>\"Augen — rechts (left)!\" and \"Augen — geradeaus!\": Commands for showing honor by turning the head to a superior and then looking straight ahead again.<\/p>\n<h3>2. Rifle Drill (Griffe)<\/h3>\n<p>\"Das Gewehr — über!\" (Shoulder arms!): The rifle is brought onto the <strong>left<\/strong> shoulder, sloping, with the butt held in the left hand.<\/p>\n<p>\"Gewehr — ab!\" (Put down — rifle!): The soldier brings the rifle from the shoulder position back vertically next to the right foot.<\/p>\n<p>\"Achtung! Präsentiert das — Gewehr!\" (Presents — rifle!): A ceremonial salute in which the rifle is held with both hands in front of the center of the body.<\/p>\n<p>\"Gewehr — umhängen!\" (Sling rifle!): The rifle is slung over the right shoulder by the belt.<\/p>\n<p>\"Gewehr auf den Rücken!\" (Rifle on the back!): The rifle is slid onto the back for greater freedom of movement.<\/p>\n<p>\"Seitengewehr pflanzt — auf!\" (Bayonet — up!): The command to attach the bayonet to the barrel of the rifle.<\/p>\n<p>\"Seitengewehr an — Ort!\" (Bayonet — down!): The act of placing the bayonet in its scabbard.<\/p>\n<h3>3. Formations<\/h3>\n<h3>3.1. Formation and Roll Call<\/h3>\n<p>When a unit needs to assemble, the following commands are used for the three basic formations:<\/p>\n<p>\"In Linie zu einem Gliede — Angetreten!\": Form up in a single line side by side.<\/p>\n<p>\"In Reihe — Angetreten!\": Form up in a row (one behind the other).<\/p>\n<p>\"In Marschordnung — Angetreten!\": Form up in the standard marching formation (in a group, this is usually a column three wide).<\/p>\n<p>\"Sammeln!\": The command to quickly assemble the unit around the commander, with the soldiers independently returning to their original order.<\/p>\n<h3>3.2. Alignment and Direction<\/h3>\n<p>To maintain a neat formation, the following orders are given:<\/p>\n<p>\"Richt Euch!\" or \"Nach links — Richt Euch!\": The command to align the line or row with the man on the right or left.<\/p>\n<p>\"Augen gerade — aus!\": After aligning, the soldiers look straight ahead again. \"Direction [target/object]!\": Indicates the direction of march for the entire formation.<\/p>\n<p>\"Abstände ... Schritt vergrößern (verringern)!\": To increase or decrease the distance between soldiers in the depth.<\/p>\n<p>\"Zwischenräume ... Schritt vergrößern (verringern)!\": To adjust the lateral spacing between soldiers or ranks.<\/p>\n<h3>3.3. Maneuvers and Turns<\/h3>\n<p>\"Rechts (Links) schwenkt — Marsch!\": A turn in which the formation moves around a corner like a revolving door. <\/p>\n<p>\"Abteilung (im Gleichschritt / ohne Tritt) — Marsch!\": The entire unit begins to move, whether or not in step.<\/p>\n<p>\"Ganze Kehrt — um!\": The entire formation turns 180 degrees. In the German army the about-turn is made over the <strong>left<\/strong>.<\/p>\n<p>\"Rechts (left) — um!\" (Right or left — turn!): A 90-degree turn on the heel.<\/p>\n<p>\"Ohne Tritt — Marsch!\" (Without step — march!): Marching without keeping step, often used for movement outside of drill.<\/p>\n<p>\"Im Gleichschritt — Marsch!\" (In step — march!): Marching at a formal pace.<\/p>\n<p>\"Abteilung — Halt!\" (Squad/unit — halt!): The order to stop the march immediately.<\/p>\n<p>\"Laufschritt — Marsch!\" (At a run — march!): Accelerating to a running pace in formation.<\/p>\n<h3>3.4. Transition between Formations (Deployment)<\/h3>\n<p>\"Reihe rechts (links), ohne Tritt — Marsch!\": Transition from a line to a rank.<\/p>\n<p>\"Marschordnung rechts — Marsch!\": Transition from a line to a marching formation.<\/p>\n<p>\"In Linie links — marschiert auf!\": From a rank or marching formation, deploy sideways again into a line.<\/p>\n<p>\"Entwicklung!\": The general term for transitioning from a closed formation to an open (geöffnete) combat formation.<\/p>\n<h3>3.5. Combat Formations (Open Order)<\/h3>\n<p>In the field, more specific terms are used for dispersal:<\/p>\n<p>\"Schützenreihe!\": The soldiers follow each other at fixed intervals (usually 5 paces).<\/p>\n<p>\"Schützenkette!\": The soldiers spread out sideways in a rifle line to avoid enemy fire and to be able to fire optimally themselves.<\/p>\n<p>\"Stellung!\" or \"Ganze Gruppe — Stellung!\": The order to immediately take up battle positions and prepare fire.<\/p>\n<p>\"Volle Deckung!\": The order to immediately seek the best possible cover in the terrain and remain invisible to the enemy.<\/p>\n<p>“Sprung!\" (Bound!): Used to advance by rapid bounds. Soldiers prepare by drawing their legs up without raising their upper bodies before rushing forward on the command \"Sprung — auf! Marsch, marsch!\"<\/p>\n<p>\"Hinlegen!\" (Lying down!): The soldier quickly throws himself flat on the ground, taking the rifle in his left hand to protect the barrel.<\/p>\n<p>\"Auf!\" (Up!): The soldier quickly jumps back up and assumes the resting position or basic stance.<\/p>\n<p>\"Laden und sichern!\" (Load and secure!): The soldier loads the magazine with a loading strip and engages the rifle's safety catch.<\/p>\n<p>\"Entladen!\" (Unload!): Safely removing the ammunition from the chamber and magazine.<\/p>\n<p>“Sichern!” (Safety): After fire is interrupted, soldiers must engage the safety of their weapons<\/p>\n<h3>4. Commands for heavier weapons<\/h3>\n<p>For soldiers training on the machine gun (M.G. 34), there are specific commands:<\/p>\n<ul>\n<li><p>Machine gun (M.G. 34/42):<\/p><\/li>\n<\/ul>\n<p>\"Laufwechsel!\" (Barrel change): A crucial command during sustained fire to prevent overheating.<\/p>\n<p>\"Schloßwechsel!\" (Lock change): In case of mechanical malfunctions.<\/p>\n<p>\"Feuer frei!\" (Fire free!\"): The command to actually begin firing bursts.<\/p>\n<p>\"Stopfen!\" (Stop): Order to immediately cease fire. Applies to all weapons.<\/p>\n<p>\"Volle Deckung!\" (Full cover): Order to seek safe shelter immediately after firing.<\/p>", "text": "1. Basic Stance and Rest \"Stillgestanden!\" (Attention!): The soldier assumes the basic, motionless stance with heels together, chest out, and eyes straight ahead. \"Rührt Euch!\" (Stand at ease!): The soldier places his left foot forward, relaxes his stance, but remains still and may not speak without permission. \"Achtung!\" (Attention!): An announcement command that forces soldiers to immediately assume the basic stance, even if no formal \"Stillgestanden\" command has been given. \"Augen — rechts (left)!\" and \"Augen — geradeaus!\": Commands for showing honor by turning the head to a superior and then looking straight ahead again. 2. Rifle Drill (Griffe) \"Das Gewehr — über!\" (Shoulder arms!): The rifle is brought onto the left shoulder, sloping, with the butt held in the left hand. \"Gewehr — ab!\" (Put down — rifle!): The soldier brings the rifle from the shoulder position back vertically next to the right foot. \"Achtung! Präsentiert das — Gewehr!\" (Presents — rifle!): A ceremonial salute in which the rifle is held with both hands in front of the center of the body. \"Gewehr — umhängen!\" (Sling rifle!): The rifle is slung over the right shoulder by the belt. \"Gewehr auf den Rücken!\" (Rifle on the back!): The rifle is slid onto the back for greater freedom of movement. \"Seitengewehr pflanzt — auf!\" (Bayonet — up!): The command to attach the bayonet to the barrel of the rifle. \"Seitengewehr an — Ort!\" (Bayonet — down!): The act of placing the bayonet in its scabbard. 3. Formations 3.1. Formation and Roll Call When a unit needs to assemble, the following commands are used for the three basic formations: \"In Linie zu einem Gliede — Angetreten!\": Form up in a single line side by side. \"In Reihe — Angetreten!\": Form up in a row (one behind the other). \"In Marschordnung — Angetreten!\": Form up in the standard marching formation (in a group, this is usually a column three wide). \"Sammeln!\": The com
